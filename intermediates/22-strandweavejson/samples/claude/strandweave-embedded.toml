# Strandweave Configuration - Embedded Codon Sequence
# This config includes the codon sequence directly

version = "1.0.0"

[server]
port = 7777
withoutProxy = false

[paths]
outputDirectory = "strandweave-results"
lockFile = ".strandweave/runtime.lock"

[paths.logs]
websocket = ".strandweave/logs/websocket.log"
server = ".strandweave/logs/server.log"

[workflow]
autostart = true
dataHashTimeLimit = 5000

# First codon: Data Parser
[[workflow.codons]]
id = "data-parser"
name = "Data Parser"
promptFile = "prompts/parse-data.md"
model = "sonnet"
continuationMode = "fresh"
description = "Parse and validate input data files"
trackedFiles = ["data/**/*.json", "data/**/*.csv"]

[[workflow.codons.rigSetup]]
type = "command"

[workflow.codons.rigSetup.command]
run = "mkdir -p output"
workingDirectory = "project"

[[workflow.codons.outputFiles]]
copy = ["output/parsed_data.json"]

[[workflow.codons.sentinels]]
sentinelConfig = "sentinels/error-detector.json"

# Loop codon: Validation Loop
[[workflow.codons]]
type = "loop"
id = "validation-loop"
name = "Data Validation Loop"
description = "Iteratively validate and fix data issues"

[workflow.codons.terminateOn]
type = "iterationLimit"
limit = 3

# Nested codons within the loop
[[workflow.codons.codons]]
id = "validate-data"
name = "Validate Data"
promptText = "Validate the parsed data in <%PROJECT_DIR%>/output/parsed_data.json and report any issues."
model = "sonnet"
continuationMode = "continue-previous"
trackedFiles = ["output/**/*"]

[workflow.codons.codons.env]
VALIDATION_STRICT = "true"

[[workflow.codons.codons]]
id = "fix-issues"
name = "Fix Issues"
promptFile = "prompts/fix-issues.md"
model = "opus"
continuationMode = "continue-previous"
trackedFiles = ["output/**/*"]

# Final codon: Generate Report
[[workflow.codons]]
id = "generate-report"
name = "Generate Report"
promptFile = ["prompts/report-intro.md", "prompts/report-template.md"]
appendSystemPromptFile = "prompts/formatting-rules.md"
model = "sonnet"
continuationMode = "fresh"
description = "Generate final report from validated data"
trackedFiles = ["reports/**/*"]

[[workflow.codons.rigSetup]]
type = "copy"

[workflow.codons.rigSetup.copy]
from = "templates/report-structure"
to = "reports"

[[workflow.codons.outputFiles]]
copy = ["reports/final_report.md"]

[[workflow.codons.outputFiles.beforeCopy]]
type = "command"

[workflow.codons.outputFiles.beforeCopy.command]
run = "date >> reports/generated_at.txt"
workingDirectory = "project"

[costs.perMTok]
input = 3.0
inputCache = 3.75
cacheRead = 0.3
output = 15.0

[llm]
defaultModel = "sonnet"

[llm.providers.anthropic]
baseUrl = ""

[llm.providers.openai]

[llm.providers.google]

[llm.providers.groq]

[llm.replay]
enabled = false
dataPath = ""

[runtime]
logParsingInterval = 1000
toolResultTruncateLength = 2500
handshakeHistoryLimit = 50

[runtime.bun]
version = ""

[docker]
enabled = false
image = ""

[sentinel]
enablePersistence = true
healthCheckGracePeriodMs = 2000
waitForAllHealthChecks = false
