$schema: ./strandweave.schema.json
version: "1.0.0"
server:
  port: 7777
  withoutProxy: false
paths:
  outputDirectory: strandweave-results
  lockFile: .strandweave/runtime.lock
  logs:
    websocket: .strandweave/logs/websocket.log
    server: .strandweave/logs/server.log
workflow:
  configFile: codex/config/codon-sequence.paths.json
  autostart: true
  dataHashTimeLimit: 5000
costs:
  perMTok:
    input: 3.0
    inputCache: 3.75
    cacheRead: 0.3
    output: 15.0
llm:
  defaultModel: sonnet
  providers:
    anthropic:
      baseUrl: null
    openai: {}
    google: {}
    groq: {}
  replay:
    enabled: false
    dataPath: null
runtime:
  logParsingInterval: 1000
  toolResultTruncateLength: 2500
  handshakeHistoryLimit: 50
  bun:
    version: null
docker:
  enabled: false
  image: null
sentinel:
  enablePersistence: true
  healthCheckGracePeriodMs: 2000
  waitForAllHealthChecks: false
