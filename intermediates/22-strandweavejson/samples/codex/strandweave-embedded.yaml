$schema: ./strandweave.schema.json
version: "1.0.0"
server:
  port: 7777
  withoutProxy: false
paths:
  outputDirectory: strandweave-results
  lockFile: .strandweave/runtime.lock
  logs:
    websocket: .strandweave/logs/websocket.log
    server: .strandweave/logs/server.log
workflow:
  autostart: true
  dataHashTimeLimit: 5000
  embeddedCodonSequence:
    - id: ingest
      name: Ingest Source Data
      promptFile: prompts/ingest.md
      model: sonnet
      continuationMode: fresh
      description: Ingest and normalize upstream data files
      trackedFiles:
        - data/raw/**/*
      rigSetup:
        - type: command
          command:
            run: mkdir -p data/normalized
            workingDirectory: project
      outputFiles:
        - copy:
            - data/normalized/**/*.json
      sentinels:
        - sentinelConfig: sentinels/data-health.json
    - id: analyze
      name: Analyze Dataset
      promptFile:
        - prompts/analyze/intro.md
        - prompts/analyze/steps.md
      appendSystemPromptFile: prompts/system/formatting.md
      model: opus
      continuationMode: continue-previous
      description: Derive insights and note anomalies
      trackedFiles:
        - data/normalized/**/*
      env:
        STRICT_MODE: "true"
costs:
  perMTok:
    input: 3.0
    inputCache: 3.75
    cacheRead: 0.3
    output: 15.0
llm:
  defaultModel: sonnet
  providers:
    anthropic:
      baseUrl: null
    openai: {}
    google: {}
    groq: {}
  replay:
    enabled: false
    dataPath: null
runtime:
  logParsingInterval: 1000
  toolResultTruncateLength: 2500
  handshakeHistoryLimit: 50
  bun:
    version: null
docker:
  enabled: false
  image: null
sentinel:
  enablePersistence: true
  healthCheckGracePeriodMs: 2000
  waitForAllHealthChecks: false
