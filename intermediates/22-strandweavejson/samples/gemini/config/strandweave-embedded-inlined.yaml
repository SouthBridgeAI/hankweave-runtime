$schema: "./strandweave.schema.json"
version: "1.0.0"

server:
  port: 7777
  withoutProxy: false

paths:
  outputDirectory: "strandweave-results"
  lockFile: ".strandweave/runtime.lock"
  logs:
    websocket: ".strandweave/logs/websocket.log"
    server: ".strandweave/logs/server.log"

workflow:
  autostart: true
  dataHashTimeLimit: 5000
  sequence:
    - id: "data-parser"
      name: "Data Parser"
      prompt: "This is a dummy prompt file for parsing data.\n"
      model: "sonnet"
      continuationMode: "fresh"
      description: "Parse and validate input data files"
      trackedFiles:
        - "data/**/*.json"
        - "data/**/*.csv"
      rigSetup:
        - type: "command"
          command:
            run: "mkdir -p output"
            workingDirectory: "project"
      outputFiles:
        - copy:
            - "output/parsed_data.json"
      sentinels:
        - sentinel:
            description: "This is a dummy sentinel configuration for detecting errors."
    - type: "loop"
      id: "validation-loop"
      name: "Data Validation Loop"
      description: "Iteratively validate and fix data issues"
      terminateOn:
        type: "iterationLimit"
        limit: 3
      codons:
        - id: "validate-data"
          name: "Validate Data"
          promptText: "Validate the parsed data in <%PROJECT_DIR%>/output/parsed_data.json and report any issues."
          model: "sonnet"
          continuationMode: "continue-previous"
          trackedFiles:
            - "output/**/*"
          env:
            VALIDATION_STRICT: "true"
        - id: "fix-issues"
          name: "Fix Issues"
          prompt: "This is a dummy prompt file for fixing issues.\n"
          model: "opus"
          continuationMode: "continue-previous"
          trackedFiles:
            - "output/**/*"
    - id: "generate-report"
      name: "Generate Report"
      prompt: "This is a dummy prompt file for the report introduction.\nThis is a dummy prompt file for the report template.\n"
      appendSystemPrompt: "This is a dummy prompt file for formatting rules.\n"
      model: "sonnet"
      continuationMode: "fresh"
      description: "Generate final report from validated data"
      trackedFiles:
        - "reports/**/*"
      rigSetup:
        - type: "copy"
          copy:
            from: "templates/report-structure"
            to: "reports"
      outputFiles:
        - copy:
            - "reports/final_report.md"
          beforeCopy:
            - type: "command"
              command:
                run: "date >> reports/generated_at.txt"
                workingDirectory: "project"

costs:
  perMTok:
    input: 3.0
    inputCache: 3.75
    cacheRead: 0.3
    output: 15.0

llm:
  defaultModel: "sonnet"
  providers:
    anthropic:
      baseUrl: null
  replay:
    enabled: false
    dataPath: null

runtime:
  logParsingInterval: 1000
  toolResultTruncateLength: 2500
  handshakeHistoryLimit: 50
  bun:
    version: null

docker:
  enabled: false
  image: null

sentinel:
  enablePersistence: true
  healthCheckGracePeriodMs: 2000
  waitForAllHealthChecks: false
