$schema = "./hankweave.schema.json"
version = "1.0.0"

[server]
port = 7777
withoutProxy = false

[paths]
outputDirectory = "hankweave-results"
lockFile = ".hankweave/runtime.lock"

[paths.logs]
websocket = ".hankweave/logs/websocket.log"
server = ".hankweave/logs/server.log"

[workflow]
autostart = true
dataHashTimeLimit = 5000

[[workflow.sequence]]
id = "data-parser"
name = "Data Parser"
promptFile = "prompts/parse-data.md"
model = "sonnet"
continuationMode = "fresh"
description = "Parse and validate input data files"
trackedFiles = ["data/**/*.json", "data/**/*.csv"]

[[workflow.sequence.rigSetup]]
type = "command"
[workflow.sequence.rigSetup.command]
run = "mkdir -p output"
workingDirectory = "project"

[[workflow.sequence.outputFiles]]
copy = ["output/parsed_data.json"]

[[workflow.sequence.sentinels]]
sentinelConfig = "sentinels/error-detector.json"

[[workflow.sequence]]
type = "loop"
id = "validation-loop"
name = "Data Validation Loop"
description = "Iteratively validate and fix data issues"

[workflow.sequence.terminateOn]
type = "iterationLimit"
limit = 3

[[workflow.sequence.codons]]
id = "validate-data"
name = "Validate Data"
promptText = "Validate the parsed data in <%PROJECT_DIR%>/output/parsed_data.json and report any issues."
model = "sonnet"
continuationMode = "continue-previous"
trackedFiles = ["output/**/*"]
[workflow.sequence.codons.env]
VALIDATION_STRICT = "true"

[[workflow.sequence.codons]]
id = "fix-issues"
name = "Fix Issues"
promptFile = "prompts/fix-issues.md"
model = "opus"
continuationMode = "continue-previous"
trackedFiles = ["output/**/*"]

[[workflow.sequence]]
id = "generate-report"
name = "Generate Report"
promptFile = ["prompts/report-intro.md", "prompts/report-template.md"]
appendSystemPromptFile = "prompts/formatting-rules.md"
model = "sonnet"
continuationMode = "fresh"
description = "Generate final report from validated data"
trackedFiles = ["reports/**/*"]

[[workflow.sequence.rigSetup]]
type = "copy"
[workflow.sequence.rigSetup.copy]
from = "templates/report-structure"
to = "reports"

[[workflow.sequence.outputFiles]]
copy = ["reports/final_report.md"]

[[workflow.sequence.outputFiles.beforeCopy]]
type = "command"
[workflow.sequence.outputFiles.beforeCopy.command]
run = "date >> reports/generated_at.txt"
workingDirectory = "project"

[costs.perMTok]
input = 3.0
inputCache = 3.75
cacheRead = 0.3
output = 15.0

[llm]
defaultModel = "sonnet"

[llm.providers.anthropic]

[llm.replay]
enabled = false

[runtime]
logParsingInterval = 1000
toolResultTruncateLength = 2500
handshakeHistoryLimit = 50

[runtime.bun]

[docker]
enabled = false

[sentinel]
enablePersistence = true
healthCheckGracePeriodMs = 2000
waitForAllHealthChecks = false
