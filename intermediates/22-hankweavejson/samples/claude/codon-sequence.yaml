# Codon Sequence Configuration
# Defines the workflow of codons to execute

- id: data-parser
  name: Data Parser
  promptFile: prompts/parse-data.md
  model: sonnet
  continuationMode: fresh
  description: Parse and validate input data files
  trackedFiles:
    - "data/**/*.json"
    - "data/**/*.csv"
  rigSetup:
    - type: command
      command:
        run: mkdir -p output
        workingDirectory: project
  outputFiles:
    - copy:
        - output/parsed_data.json
  sentinels:
    - sentinelConfig: sentinels/error-detector.json

- type: loop
  id: validation-loop
  name: Data Validation Loop
  description: Iteratively validate and fix data issues
  terminateOn:
    type: iterationLimit
    limit: 3
  codons:
    - id: validate-data
      name: Validate Data
      promptText: >
        Validate the parsed data in <%PROJECT_DIR%>/output/parsed_data.json
        and report any issues.
      model: sonnet
      continuationMode: continue-previous
      trackedFiles:
        - "output/**/*"
      env:
        VALIDATION_STRICT: "true"

    - id: fix-issues
      name: Fix Issues
      promptFile: prompts/fix-issues.md
      model: opus
      continuationMode: continue-previous
      trackedFiles:
        - "output/**/*"

- id: generate-report
  name: Generate Report
  promptFile:
    - prompts/report-intro.md
    - prompts/report-template.md
  appendSystemPromptFile: prompts/formatting-rules.md
  model: sonnet
  continuationMode: fresh
  description: Generate final report from validated data
  trackedFiles:
    - "reports/**/*"
  rigSetup:
    - type: copy
      copy:
        from: templates/report-structure
        to: reports
  outputFiles:
    - copy:
        - reports/final_report.md
      beforeCopy:
        - type: command
          command:
            run: date >> reports/generated_at.txt
            workingDirectory: project
