$schema = "./hankweave.schema.json"
version = "1.0.0"

[server]
port = 9090
withoutProxy = false

[paths]
outputDirectory = "hankweave-embedded-inline-results"
lockFile = ".hankweave/runtime.lock"

[paths.logs]
websocket = ".hankweave/logs/websocket.log"
server = ".hankweave/logs/server.log"

[workflow]
autostart = true
dataHashTimeLimit = 6000

[[workflow.embeddedCodonSequence]]
id = "ingest"
name = "Ingest Source Data"
promptText = """
You are a data ingestion assistant. Normalize raw files in <%PROJECT_DIR%>/data/raw into JSON placed under data/normalized.
"""
model = "sonnet"
continuationMode = "fresh"
description = "Embedded version with inline templates"
trackedFiles = ["data/raw/**/*"]
rigSetup = [{ type = "command", command = { run = "mkdir -p data/normalized", workingDirectory = "project" } }]
outputFiles = [{ copy = ["data/normalized/**/*.json"] }]
sentinels = [{ sentinelConfig = "sentinels/data-health.json" }]

[[workflow.embeddedCodonSequence]]
id = "analyze"
name = "Analyze Dataset"
promptText = """
Summarize anomalies and trends in the normalized dataset. List data-quality gaps and propose fixes.
"""
appendSystemPromptText = "Return results as bullet points followed by a short next-step checklist."
model = "opus"
continuationMode = "continue-previous"
description = "Derive insights and note anomalies using inline templates"
trackedFiles = ["data/normalized/**/*"]

[workflow.embeddedCodonSequence.env]
STRICT_MODE = "true"

[llm]
defaultModel = "opus"

[llm.providers.anthropic]
baseUrl = ""

[runtime]
logParsingInterval = 500
toolResultTruncateLength = 1800
handshakeHistoryLimit = 80

[runtime.bun]
version = "1.1.15"

docker.enabled = false
docker.image = ""

[sentinel]
enablePersistence = true
healthCheckGracePeriodMs = 1000
waitForAllHealthChecks = true
