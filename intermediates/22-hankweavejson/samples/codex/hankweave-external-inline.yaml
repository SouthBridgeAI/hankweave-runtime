$schema: ./hankweave.schema.json
version: "1.0.0"
server:
  port: 8081
  withoutProxy: true
paths:
  outputDirectory: hankweave-inline-results
  lockFile: .hankweave/runtime.lock
  logs:
    websocket: .hankweave/logs/websocket.log
    server: .hankweave/logs/server.log
workflow:
  configFile: codex/config/codon-sequence.inline.json
  autostart: false
  dataHashTimeLimit: 8000
llm:
  defaultModel: opus
  providers:
    anthropic:
      baseUrl: https://api.anthropic.com
runtime:
  logParsingInterval: 750
  toolResultTruncateLength: 2000
  handshakeHistoryLimit: 75
  bun:
    version: "1.1.15"
docker:
  enabled: true
  image: ghcr.io/example/hankweave:latest
sentinel:
  enablePersistence: false
  healthCheckGracePeriodMs: 1500
  waitForAllHealthChecks: true
