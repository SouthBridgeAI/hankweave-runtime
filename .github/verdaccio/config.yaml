# Verdaccio configuration for CI testing
# This runs a local npm registry for testing package installation before publishing

storage: ./verdaccio-storage

# Disable authentication for CI testing
auth:
  htpasswd:
    file: ./htpasswd
    max_users: -1
    # Allow anonymous publishing for CI
    algorithm: bcrypt

uplinks:
  npmjs:
    url: https://registry.npmjs.org/
    timeout: 60s

packages:
  # Scoped packages
  '@*/*':
    access: $anonymous
    publish: $anonymous
    unpublish: $anonymous
    proxy: npmjs

  # All other packages
  '**':
    access: $anonymous
    publish: $anonymous
    unpublish: $anonymous
    proxy: npmjs

server:
  keepAliveTimeout: 60

middlewares:
  audit:
    enabled: false

# Minimal logging for CI
logs: { type: stdout, format: pretty, level: warn }
