name: CI

on:
  push:
    branches:
      - master
      # TODO: remove notion-strand-improvements after merge
      - notion-strand-improvements
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  HANKWEAVE_SENTINEL_ANTHROPIC_API_KEY: ${{ secrets.HANKWEAVE_SENTINEL_ANTHROPIC_API_KEY }}

jobs:
  lint-and-typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          install-gemini: 'false'

      - name: Run linting
        run: bun run lint

      - name: Run type check
        run: bun run tc

  tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Run unit tests
        run: bun test tests/unit

      - name: Run integration tests
        run: bun test tests/integration

  init-e2e-normal:
    name: Init E2E - Normal Mode
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Run init E2E test (normal mode)
        run: bun run test:e2e:init

  init-e2e-npx:
    name: Init E2E - NPX Mode
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Build package
        run: bun run build

      - name: Run init E2E test (npx mode)
        run: bun run test:e2e:init:npx

  init-e2e-binary:
    name: Init E2E - Binary Mode
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Build binary
        run: bun scripts/build-executable.ts linux-x64

      - name: Run init E2E test (binary mode)
        run: bun run test:e2e:init:binary
