name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  STRANDWEAVE_SENTINEL_ANTHROPIC_API_KEY: ${{ secrets.STRANDWEAVE_SENTINEL_ANTHROPIC_API_KEY }}

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pkg_name: ${{ steps.pkg-info.outputs.name }}
      pkg_version: ${{ steps.pkg-info.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Get package info
        id: pkg-info
        run: |
          PKG_NAME=$(node -p 'require("./package.json").name')
          PKG_VERSION=$(node -p 'require("./package.json").version')
          echo "name=${PKG_NAME}" >> $GITHUB_OUTPUT
          echo "version=${PKG_VERSION}" >> $GITHUB_OUTPUT
          echo "Publishing ${PKG_NAME}@${PKG_VERSION}"

      - name: Verify tag matches version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION="${{ steps.pkg-info.outputs.version }}"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "✓ Tag version matches package.json version"

      - name: Run type check
        run: bun run tc

      - name: Run linting
        run: bun run lint

      - name: Run unit tests
        run: bun test tests/unit

      - name: Run integration tests
        run: bun test tests/integration

      - name: Build package
        run: bun run build

      - name: Verify build output
        run: |
          echo "=== Verifying dist/ directory ==="
          ls -lah dist/
          echo ""
          echo "=== Checking dist/index.js exists ==="
          test -f dist/index.js && echo "✓ dist/index.js exists" || (echo "✗ dist/index.js missing" && exit 1)

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "=== Publishing package to npm ==="
          npm publish
          echo ""
          echo "✓ Published: ${{ steps.pkg-info.outputs.name }}@${{ steps.pkg-info.outputs.version }}"

  build-executables:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: publish-npm
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-latest
          - target: darwin-x64
            os: macos-latest
          - target: darwin-arm64
            os: macos-latest
          - target: windows-x64
            os: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Build executable
        run: bun scripts/build-executable.ts ${{ matrix.target }}

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: strandweave-${{ matrix.target }}
          path: releases/strandweave${{ matrix.target == 'windows-x64' && '.exe' || '' }}
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-npm, build-executables]
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets

          # Rename artifacts to include target in filename
          mv artifacts/strandweave-linux-x64/strandweave release-assets/strandweave-linux-x64
          mv artifacts/strandweave-linux-arm64/strandweave release-assets/strandweave-linux-arm64
          mv artifacts/strandweave-darwin-x64/strandweave release-assets/strandweave-darwin-x64
          mv artifacts/strandweave-darwin-arm64/strandweave release-assets/strandweave-darwin-arm64
          mv artifacts/strandweave-windows-x64/strandweave.exe release-assets/strandweave-windows-x64.exe

          # Make them executable
          chmod +x release-assets/strandweave-*

          # List files
          ls -lh release-assets/

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Extract the section for this version from CHANGELOG.md
          if [ -f CHANGELOG.md ]; then
            # Look for ## [version] and extract until the next ## line
            CHANGELOG_CONTENT=$(awk "/^## \[${VERSION}\]/,/^## \[/{if(/^## \[${VERSION}\]/) f=1; else if(/^## \[/) f=0; if(f && !/^## \[${VERSION}\]/) print}" CHANGELOG.md)

            if [ -z "$CHANGELOG_CONTENT" ]; then
              echo "No changelog entry found for version ${VERSION}, using default notes"
              CHANGELOG_CONTENT="See commits for details: https://github.com/${{ github.repository }}/commits/v${VERSION}"
            fi
          else
            echo "No CHANGELOG.md found, using default notes"
            CHANGELOG_CONTENT="See commits for details: https://github.com/${{ github.repository }}/commits/v${VERSION}"
          fi

          # Save to file
          cat > release-notes.md << 'EOF'
          # Strandweave Release

          This release includes:
          - npm package: `${{ needs.publish-npm.outputs.pkg_name }}@${{ steps.version.outputs.version }}`
          - Standalone executables for all major platforms

          ## Installation

          **Via NPX:**
          ```bash
          npx ${{ needs.publish-npm.outputs.pkg_name }}@${{ steps.version.outputs.version }} --init
          ```

          **Via Standalone Executable:**
          Download the binary for your platform below, make it executable, and run it.

          ## What's Changed

          EOF

          echo "$CHANGELOG_CONTENT" >> release-notes.md

          cat >> release-notes.md << 'EOF'

          ## Platform-Specific Instructions

          ### macOS
          - **Apple Silicon (M1/M2/M3)**: `strandweave-darwin-arm64`
          - **Intel**: `strandweave-darwin-x64`

          After downloading:
          ```bash
          xattr -d com.apple.quarantine strandweave-darwin-arm64
          chmod +x strandweave-darwin-arm64
          ./strandweave-darwin-arm64 --help
          ```

          ### Linux
          - **x64**: `strandweave-linux-x64`
          - **ARM64**: `strandweave-linux-arm64`

          ```bash
          chmod +x strandweave-linux-x64
          ./strandweave-linux-x64 --help
          ```

          ### Windows
          - **x64**: `strandweave-windows-x64.exe`

          ```powershell
          .\strandweave-windows-x64.exe --help
          ```
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Strandweave v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            release-assets/strandweave-linux-x64
            release-assets/strandweave-linux-arm64
            release-assets/strandweave-darwin-x64
            release-assets/strandweave-darwin-arm64
            release-assets/strandweave-windows-x64.exe
