name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # mints the OIDC token npm exchanges for a publish token
    outputs:
      pkg_version: ${{ steps.pkg-info.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # No `registry-url` on purpose. With it set, setup-node writes
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into the runner's
      # .npmrc; with no token in the environment that expands to an empty
      # string, which has been reported to mask or short-circuit the OIDC
      # exchange (npm/documentation#1960). We don't need it — npm already
      # defaults to registry.npmjs.org, which is where this publishes.
      #
      # Node 24 for npm >= 11.5.1 (Node 22.x still ships npm 10.x, which has no
      # OIDC support at all).
      - name: Setup Node.js for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Fail with a legible message rather than an opaque ENEEDAUTH if the
      # toolchain ever regresses below the trusted-publishing floor.
      - name: Verify npm supports trusted publishing
        run: |
          NPM_VERSION="$(npm --version)"
          REQUIRED=11.5.1
          echo "node $(node --version), npm ${NPM_VERSION}"
          if [ "$(printf '%s\n%s\n' "$REQUIRED" "$NPM_VERSION" | sort -V | head -1)" != "$REQUIRED" ]; then
            echo "Error: npm ${NPM_VERSION} is older than ${REQUIRED} — trusted publishing (OIDC) will not be attempted"
            exit 1
          fi
          echo "✓ npm ${NPM_VERSION} supports trusted publishing"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get package info
        id: pkg-info
        run: |
          PKG_VERSION=$(node -p 'require("./package.json").version')
          echo "version=${PKG_VERSION}" >> $GITHUB_OUTPUT
          echo "Publishing hankweave@${PKG_VERSION}"

      - name: Verify tag matches version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION="${{ steps.pkg-info.outputs.version }}"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "✓ Tag version matches package.json version"

      - name: Run type check
        run: bun run tc

      - name: Run linting
        run: bun run lint

      - name: Verify package.json is configured for public release
        run: |
          PKG_NAME=$(node -p 'require("./package.json").name')
          PKG_REPO=$(node -p 'require("./package.json").repository?.url ?? ""')
          PKG_LICENSE=$(node -p 'require("./package.json").license ?? ""')
          EXPECTED_REPO="git+https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "$PKG_NAME" != "hankweave" ]; then
            echo "Error: package.json name is '$PKG_NAME', expected 'hankweave'"
            echo "The sync workflow should have transformed package.json"
            exit 1
          fi
          # npm verifies the provenance attestation against repository.url and
          # rejects the publish with a 422 on any mismatch, case included.
          # Checked here so a transform regression fails with a readable message
          # instead of a registry error after the build has already run.
          if [ "$PKG_REPO" != "$EXPECTED_REPO" ]; then
            echo "Error: package.json repository.url is '$PKG_REPO', expected '$EXPECTED_REPO'"
            echo "See transformPackageJson in the private repo's scripts/sync-public.ts"
            exit 1
          fi
          if [ -z "$PKG_LICENSE" ]; then
            echo "Error: package.json has no license field"
            exit 1
          fi
          echo "✓ package.json configured correctly:"
          echo "  name:       $PKG_NAME"
          echo "  repository: $PKG_REPO"
          echo "  license:    $PKG_LICENSE"

      - name: Build
        run: bun run build

      # Trusted publishing: npm authenticates with the GitHub OIDC token minted
      # by `id-token: write` and exchanges it for a short-lived publish token.
      # There is no NPM_TOKEN. Provenance is generated automatically because the
      # repo and the package are both public, so no --provenance flag is needed.
      #
      # --loglevel verbose surfaces npm's `oidc` diagnostics; without it a failed
      # token exchange is invisible and only shows up as ENEEDAUTH. Safe to drop
      # once this path has a few clean releases behind it.
      - name: Publish to npm
        run: npm publish --access public --loglevel verbose

  build-executables:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
            can_test: true
          - target: linux-arm64
            os: ubuntu-latest
            can_test: false
            cross_compile: true
          - target: darwin-x64
            os: macos-latest
            can_test: false
            cross_compile: true
          - target: darwin-arm64
            os: macos-latest
            can_test: true
          - target: windows-x64
            os: windows-latest
            can_test: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install cross-platform SDK binaries
        if: matrix.cross_compile
        run: bun scripts/install-cross-platform-binaries.ts ${{ matrix.target }}

      - name: Build executable
        run: bun scripts/build-executable.ts ${{ matrix.target }}

      - name: Smoke test - Run --help
        if: matrix.can_test
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == "windows-x64" ]]; then
            releases/hankweave.exe --help
          else
            ./releases/hankweave --help
          fi

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: hankweave-${{ matrix.target }}
          path: releases/hankweave${{ matrix.target == 'windows-x64' && '.exe' || '' }}
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-executables]  # Only depends on binaries - release even if npm fails
    if: always() && needs.build-executables.result == 'success'
    timeout-minutes: 10
    permissions:
      contents: write # attaches binaries to the GitHub release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets

          # Rename artifacts to include target in filename
          mv artifacts/hankweave-linux-x64/hankweave release-assets/hankweave-linux-x64
          mv artifacts/hankweave-linux-arm64/hankweave release-assets/hankweave-linux-arm64
          mv artifacts/hankweave-darwin-x64/hankweave release-assets/hankweave-darwin-x64
          mv artifacts/hankweave-darwin-arm64/hankweave release-assets/hankweave-darwin-arm64
          mv artifacts/hankweave-windows-x64/hankweave.exe release-assets/hankweave-windows-x64.exe

          # Make them executable
          chmod +x release-assets/hankweave-*

          # List files
          ls -lh release-assets/

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Check if RELEASE_NOTES.md exists (created by sync workflow)
          if [ -f RELEASE_NOTES.md ]; then
            echo "Using RELEASE_NOTES.md from sync workflow"
            CHANGELOG_CONTENT=$(cat RELEASE_NOTES.md)
          elif [ -f CHANGELOG.md ]; then
            # Extract the section for this version from CHANGELOG.md
            CHANGELOG_CONTENT=$(awk "/^## \[${VERSION}\]/,/^## \[/{if(/^## \[${VERSION}\]/) f=1; else if(/^## \[/) f=0; if(f && !/^## \[${VERSION}\]/) print}" CHANGELOG.md)
          fi

          if [ -z "$CHANGELOG_CONTENT" ]; then
            echo "No changelog entry found for version ${VERSION}, using default notes"
            CHANGELOG_CONTENT="See commits for details."
          fi

          # Save to file for release
          cat > release-notes.md << 'NOTES_EOF'
          ## Installation

          **Via npm:**
          ```bash
          npm install -g hankweave
          # or
          npx hankweave --init
          ```

          **Via Standalone Executable:**
          Download the binary for your platform below, make it executable, and run it.

          ## What's Changed

          NOTES_EOF

          echo "$CHANGELOG_CONTENT" >> release-notes.md

          cat >> release-notes.md << 'NOTES_EOF'

          ## Platform-Specific Instructions

          ### macOS
          - **Apple Silicon (M1/M2/M3)**: `hankweave-darwin-arm64`
          - **Intel**: `hankweave-darwin-x64`

          After downloading:
          ```bash
          xattr -d com.apple.quarantine hankweave-darwin-arm64
          chmod +x hankweave-darwin-arm64
          ./hankweave-darwin-arm64 --help
          ```

          ### Linux
          - **x64**: `hankweave-linux-x64`
          - **ARM64**: `hankweave-linux-arm64`

          ```bash
          chmod +x hankweave-linux-x64
          ./hankweave-linux-x64 --help
          ```

          ### Windows
          - **x64**: `hankweave-windows-x64.exe`

          ```powershell
          .\hankweave-windows-x64.exe --help
          ```
          NOTES_EOF

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Hankweave v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            release-assets/hankweave-linux-x64
            release-assets/hankweave-linux-arm64
            release-assets/hankweave-darwin-x64
            release-assets/hankweave-darwin-arm64
            release-assets/hankweave-windows-x64.exe
