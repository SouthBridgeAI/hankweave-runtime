name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run publish in dry-run mode (test without actually publishing)'
        required: false
        type: boolean
        default: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run type check
        run: bun run tc

      - name: Run linting
        run: bun run lint

      - name: Build package
        run: bun run build

      - name: Verify build output
        run: |
          echo "=== Verifying dist/ directory ==="
          ls -lah dist/
          echo ""
          echo "=== Checking dist/index.js exists ==="
          test -f dist/index.js && echo "✓ dist/index.js exists" || (echo "✗ dist/index.js missing" && exit 1)

      - name: Publish to npm (dry-run)
        if: inputs.dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "=== Running publish in DRY-RUN mode ==="
          npm publish --dry-run
          echo ""
          echo "✓ Dry-run completed successfully!"
          echo "Package would be published as: $(node -p \"require('./package.json').name\")@$(node -p \"require('./package.json').version\")"

      - name: Publish to npm
        if: "!inputs.dry-run"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "=== Publishing package to npm ==="
          npm publish
          echo ""
          echo "✓ Published: $(node -p \"require('./package.json').name\")@$(node -p \"require('./package.json').version\")"

      - name: Create summary
        if: always()
        run: |
          echo "## Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** $(node -p \"require('./package.json').name\")" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** $(node -p \"require('./package.json').version\")" >> $GITHUB_STEP_SUMMARY
          echo "**Dry-run:** ${{ inputs.dry-run }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.dry-run }}" = "false" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Installation" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "npx $(node -p \"require('./package.json').name\")@$(node -p \"require('./package.json').version\") --init" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
