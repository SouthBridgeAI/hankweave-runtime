name: Publish to npm

on:
  push:
    branches:
      - strandweave-npx
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run publish in dry-run mode (test without actually publishing)'
        required: false
        type: boolean
        default: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run type check
        run: bun run tc

      - name: Run linting
        run: bun run lint

      - name: Build package
        run: bun run build

      - name: Verify build output
        run: |
          echo "=== Verifying dist/ directory ==="
          ls -lah dist/
          echo ""
          echo "=== Checking dist/index.js exists ==="
          test -f dist/index.js && echo "✓ dist/index.js exists" || (echo "✗ dist/index.js missing" && exit 1)

      - name: Publish to npm (dry-run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "=== Running publish in DRY-RUN mode ==="
          npm publish --dry-run
          echo ""
          echo "✓ Dry-run completed successfully!"
          PKG_NAME=$(node -p 'require("./package.json").name')
          PKG_VERSION=$(node -p 'require("./package.json").version')
          echo "Package would be published as: ${PKG_NAME}@${PKG_VERSION}"

      - name: Publish to npm
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "=== Publishing package to npm ==="
          npm publish
          echo ""
          PKG_NAME=$(node -p 'require("./package.json").name')
          PKG_VERSION=$(node -p 'require("./package.json").version')
          echo "✓ Published: ${PKG_NAME}@${PKG_VERSION}"

      - name: Create summary
        if: always()
        run: |
          PKG_NAME=$(node -p 'require("./package.json").name')
          PKG_VERSION=$(node -p 'require("./package.json").version')
          echo "## Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** ${PKG_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${PKG_VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Dry-run:** ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || 'false' }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.dry-run }}" != "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Installation" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "npx ${PKG_NAME}@${PKG_VERSION} --init" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
