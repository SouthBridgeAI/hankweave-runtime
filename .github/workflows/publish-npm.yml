name: Publish to npm

on:
  push:
    branches:
      - strandweave-npx
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run publish in dry-run mode (test without actually publishing)'
        required: false
        type: boolean
        default: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pkg_name: ${{ steps.pkg-info.outputs.name }}
      pkg_version: ${{ steps.pkg-info.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Get package info
        id: pkg-info
        run: |
          PKG_NAME=$(node -p 'require("./package.json").name')
          PKG_VERSION=$(node -p 'require("./package.json").version')
          echo "name=${PKG_NAME}" >> $GITHUB_OUTPUT
          echo "version=${PKG_VERSION}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: bun install

      - name: Run type check
        run: bun run tc

      - name: Run linting
        run: bun run lint

      - name: Run unit tests
        run: bun test tests/unit

      # integration tests require Claude Code in the system
      - name: Install Claude Code globally
        run: npm install -g @anthropic-ai/claude-code

      - name: Run integration tests
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: bun test tests/integration

      - name: Build package
        run: bun run build

      - name: Verify build output
        run: |
          echo "=== Verifying dist/ directory ==="
          ls -lah dist/
          echo ""
          echo "=== Checking dist/index.js exists ==="
          test -f dist/index.js && echo "✓ dist/index.js exists" || (echo "✗ dist/index.js missing" && exit 1)

      - name: Publish to npm (dry-run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "=== Running publish in DRY-RUN mode ==="
          npm publish --dry-run
          echo ""
          echo "✓ Dry-run completed successfully!"
          echo "Package would be published as: ${{ steps.pkg-info.outputs.name }}@${{ steps.pkg-info.outputs.version }}"

      - name: Publish to npm
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "=== Publishing package to npm ==="
          npm publish
          echo ""
          echo "✓ Published: ${{ steps.pkg-info.outputs.name }}@${{ steps.pkg-info.outputs.version }}"

  smoke-tests:
    name: Smoke test on ${{ matrix.os }} with ${{ matrix.package-manager }}
    runs-on: ${{ matrix.os }}
    needs: publish
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run)
    timeout-minutes: 15

    env:
      PKG_SPEC: ${{ needs.publish.outputs.pkg_name }}@${{ needs.publish.outputs.pkg_version }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        package-manager: [npx, bunx]

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        # if: matrix.package-manager == 'bunx'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Create test directory
        id: test-dir
        shell: bash
        run: |
          TEST_DIR=$(mktemp -d)
          # Convert to Windows path on Windows runners
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            TEST_DIR=$(cygpath -w "$TEST_DIR")
          fi
          echo "test_dir=${TEST_DIR}" >> $GITHUB_OUTPUT
          echo "Created test directory: ${TEST_DIR}"

      - name: Configure npm authentication
        shell: bash
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > "${HOME}/.npmrc"
          echo "✓ Created .npmrc with authentication in home directory"
          echo "Debug: HOME=${HOME}"
          echo "Debug: .npmrc path: ${HOME}/.npmrc"

      - name: Configure bun authentication
        if: matrix.package-manager == 'bunx'
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          {
            echo "[install]"
            echo "registry = \"https://registry.npmjs.org/\""
            echo ""
            echo "[install.scopes]"
            echo "\"@southbridgeai\" = { token = \"${NPM_TOKEN}\" }"
          } > "${HOME}/.bunfig.toml"
          echo "✓ Created bunfig.toml with authentication"
          echo "Debug: bunfig.toml location: ${HOME}/.bunfig.toml"
          echo "Debug: bunfig.toml exists: $([ -f "${HOME}/.bunfig.toml" ] && echo 'yes' || echo 'no')"
          echo "Debug: bunfig.toml size: $(wc -c < "${HOME}/.bunfig.toml") bytes"

      - name: Debug authentication setup
        if: matrix.package-manager == 'bunx'
        shell: bash
        run: |
          echo "=== Debugging authentication setup ==="
          echo "HOME: ${HOME}"
          echo "USER: ${USER}"
          echo "npmrc exists at ${HOME}/.npmrc: $([ -f "${HOME}/.npmrc" ] && echo 'yes' || echo 'no')"
          echo "bunfig.toml exists at ${HOME}/.bunfig.toml: $([ -f "${HOME}/.bunfig.toml" ] && echo 'yes' || echo 'no')"
          echo ""
          echo "Checking alternate locations:"
          echo "npmrc in working dir: $([ -f .npmrc ] && echo 'yes' || echo 'no')"
          echo "bunfig.toml in working dir: $([ -f bunfig.toml ] && echo 'yes' || echo 'no')"
          echo ""
          echo "bunfig.toml contents (sanitized):"
          sed 's/token = ".*"/token = "***"/' "${HOME}/.bunfig.toml"
          echo ""
          echo "Testing bun config:"
          bun --version || echo "bun not in PATH"

      - name: Test npx init command
        if: matrix.package-manager == 'npx'
        shell: bash
        working-directory: ${{ steps.test-dir.outputs.test_dir }}
        run: npx --yes ${{ env.PKG_SPEC }} --init

      - name: Test bunx init command
        if: matrix.package-manager == 'bunx'
        shell: bash
        working-directory: ${{ steps.test-dir.outputs.test_dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bunx ${{ env.PKG_SPEC }} --init

      - name: Test npx basic command
        if: matrix.package-manager == 'npx'
        shell: bash
        working-directory: ${{ steps.test-dir.outputs.test_dir }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          STRANDWEAVE_SENTINEL_ANTHROPIC_API_KEY: ${{ secrets.STRANDWEAVE_SENTINEL_ANTHROPIC_API_KEY }}
        run: npx ${{ env.PKG_SPEC }} --basic --data=./data

      - name: Test bunx basic command
        if: matrix.package-manager == 'bunx'
        shell: bash
        working-directory: ${{ steps.test-dir.outputs.test_dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          STRANDWEAVE_SENTINEL_ANTHROPIC_API_KEY: ${{ secrets.STRANDWEAVE_SENTINEL_ANTHROPIC_API_KEY }}
        run: bunx ${{ env.PKG_SPEC }} --basic --data=./data
