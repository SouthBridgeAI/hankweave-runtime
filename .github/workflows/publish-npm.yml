name: Publish to npm

on:
  push:
    branches:
      - strandweave-npx
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run publish in dry-run mode (test without actually publishing)'
        required: false
        type: boolean
        default: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pkg_name: ${{ steps.pkg-info.outputs.name }}
      pkg_version: ${{ steps.pkg-info.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Get package info
        id: pkg-info
        run: |
          PKG_NAME=$(node -p 'require("./package.json").name')
          PKG_VERSION=$(node -p 'require("./package.json").version')
          echo "name=${PKG_NAME}" >> $GITHUB_OUTPUT
          echo "version=${PKG_VERSION}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: bun install

      - name: Run type check
        run: bun run tc

      - name: Run linting
        run: bun run lint

      - name: Run unit tests
        run: bun test tests/unit

      - name: Run integration tests
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: bun test tests/integration

      - name: Build package
        run: bun run build

      - name: Verify build output
        run: |
          echo "=== Verifying dist/ directory ==="
          ls -lah dist/
          echo ""
          echo "=== Checking dist/index.js exists ==="
          test -f dist/index.js && echo "✓ dist/index.js exists" || (echo "✗ dist/index.js missing" && exit 1)

      - name: Publish to npm (dry-run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "=== Running publish in DRY-RUN mode ==="
          npm publish --dry-run
          echo ""
          echo "✓ Dry-run completed successfully!"
          echo "Package would be published as: ${{ steps.pkg-info.outputs.name }}@${{ steps.pkg-info.outputs.version }}"

      - name: Publish to npm
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "=== Publishing package to npm ==="
          npm publish
          echo ""
          echo "✓ Published: ${{ steps.pkg-info.outputs.name }}@${{ steps.pkg-info.outputs.version }}"

      - name: Create publish summary
        if: always()
        run: |
          echo "## Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** ${{ steps.pkg-info.outputs.name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.pkg-info.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Dry-run:** ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || 'false' }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.dry-run }}" != "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Installation" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "npx ${{ steps.pkg-info.outputs.name }}@${{ steps.pkg-info.outputs.version }} --init" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

  smoke-tests:
    name: Smoke test on ${{ matrix.os }} with ${{ matrix.package-manager }}
    runs-on: ${{ matrix.os }}
    needs: publish
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run)
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        package-manager: [npx, bunx]

    steps:
      - name: Wait for npm propagation
        run: |
          echo "Waiting 30 seconds for npm CDN to propagate the package..."
          sleep 30
          echo "✓ Wait complete, proceeding with smoke tests"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        # if: matrix.package-manager == 'bunx'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configure npm authentication
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Run smoke tests with ${{ matrix.package-manager }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          STRANDWEAVE_SENTINEL_ANTHROPIC_API_KEY: ${{ secrets.STRANDWEAVE_SENTINEL_ANTHROPIC_API_KEY }}
        shell: bash
        run: |
          PKG_NAME="${{ needs.publish.outputs.pkg_name }}"
          PKG_VERSION="${{ needs.publish.outputs.pkg_version }}"
          PACKAGE_MANAGER="${{ matrix.package-manager }}"

          echo "=== Running smoke tests for ${PKG_NAME}@${PKG_VERSION} with ${PACKAGE_MANAGER} ==="
          echo ""

          # Create a temporary test directory
          TEST_DIR=$(mktemp -d)
          echo "Created test directory: ${TEST_DIR}"
          cd "${TEST_DIR}"

          # Test 1: Initialize
          echo ""
          echo "Test 1: Running --init with ${PACKAGE_MANAGER}..."
          if [ "${PACKAGE_MANAGER}" = "npx" ]; then
            npx --yes ${PKG_NAME}@${PKG_VERSION} --init
          elif [ "${PACKAGE_MANAGER}" = "bunx" ]; then
            bunx ${PKG_NAME}@${PKG_VERSION} --init
          fi
          echo "✓ Init completed"

          # Test 2: Basic command with data
          echo ""
          echo "Test 2: Running --basic --data=./data with ${PACKAGE_MANAGER}..."
          if [ "${PACKAGE_MANAGER}" = "npx" ]; then
            npx ${PKG_NAME}@${PKG_VERSION} --basic --data=./data
          elif [ "${PACKAGE_MANAGER}" = "bunx" ]; then
            bunx ${PKG_NAME}@${PKG_VERSION} --basic --data=./data
          fi
          echo "✓ Basic command completed"

          # Clean up
          cd -
          rm -rf "${TEST_DIR}"
          echo ""
          echo "✓ All smoke tests passed for ${PACKAGE_MANAGER} on ${{ matrix.os }}!"

      - name: Create smoke test summary
        if: always()
        run: |
          echo "## Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**OS:** ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
          echo "**Package Manager:** ${{ matrix.package-manager }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
