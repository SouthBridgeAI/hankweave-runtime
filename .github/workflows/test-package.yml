name: Test Package

on:
  push:
    branches:
      - strandweave-npx

jobs:
  test-package:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: bun install

      # Run package installation e2e test (handles Verdaccio in-process)
      - name: Run package installation tests
        run: bun test tests/e2e/package-installation.e2e.test.ts

      # Install Gemini CLI for e2e tests
      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli

      # Run happy-path e2e tests with different package managers
      # These automatically start Verdaccio, build, publish, and test
      - name: Run e2e tests with npx
        env:
          STRANDWEAVE_TEST_USE_NPX: 1
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STRANDWEAVE_SENTINEL_ANTHROPIC_API_KEY: ${{ secrets.STRANDWEAVE_SENTINEL_ANTHROPIC_API_KEY }}
        run: bun test tests/e2e/happy-path-e2e.test.ts

      # - name: Run e2e tests with bunx
      #   env:
      #     STRANDWEAVE_TEST_USE_BUNX: 1
      #     CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      #     GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      #     STRANDWEAVE_SENTINEL_ANTHROPIC_API_KEY: ${{ secrets.STRANDWEAVE_SENTINEL_ANTHROPIC_API_KEY }}
      #   run: bun test tests/e2e/happy-path-e2e.test.ts

      # - name: Run e2e tests with pnpm dlx
      #   env:
      #     STRANDWEAVE_TEST_USE_PNPM_DLX: 1
      #     CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      #     GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      #     STRANDWEAVE_SENTINEL_ANTHROPIC_API_KEY: ${{ secrets.STRANDWEAVE_SENTINEL_ANTHROPIC_API_KEY }}
      #   run: bun test tests/e2e/happy-path-e2e.test.ts

      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            tests/test-results/
            tests/test-area/
          retention-days: 7
