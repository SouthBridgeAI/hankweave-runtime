name: 'Setup Environment'
description: 'Sets up Node.js, Bun, and project dependencies'

inputs:
  install-gemini:
    description: 'Install gemini-cli globally'
    required: false
    default: 'true'
  codex-auth-json:
    description: 'Codex auth.json content for authentication (codex binary is bundled with @openai/codex-sdk)'
    required: false
    default: ''
  registry-url:
    description: 'Optional registry URL for npm publishing'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        registry-url: ${{ inputs.registry-url || '' }}

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Install gemini-cli globally
      if: inputs.install-gemini == 'true'
      shell: bash
      run: npm install -g @google/gemini-cli

    - name: Setup Codex authentication
      if: inputs.codex-auth-json != ''
      shell: bash
      run: |
        # Create ~/.codex directory
        mkdir -p ~/.codex

        # Create auth.json from input (codex binary is bundled with @openai/codex-sdk package)
        echo '${{ inputs.codex-auth-json }}' > ~/.codex/auth.json

        # Verify file was created (for debugging)
        if [ -f ~/.codex/auth.json ]; then
          echo "✓ auth.json created successfully"
        else
          echo "✗ Failed to create auth.json"
          exit 1
        fi
